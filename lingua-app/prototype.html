<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Lingua prototype</title><style>:root{
    --background:0 0% 100%; --foreground:240 10% 3.9%;
    --card:0 0% 100%; --card-foreground:240 10% 3.9%;
    --primary:74 87% 57%; --primary-foreground:240 6% 10%;
    --secondary:240 4.8% 95.9%; --secondary-foreground:240 5.9% 10%;
    --muted:240 4.8% 95.9%; --muted-foreground:240 3.8% 46.1%;
    --accent:240 4.8% 95.9%; --accent-foreground:240 5.9% 10%;
    --success:142 71% 45%; --warm:26 90% 55%; --info:208 72% 45%; --border:240 5.9% 90%; --input:240 5.9% 90%;
    --ring:74 66% 45%; --radius:0.5rem;
  }
  .dark{
    --background:240 10% 3.9%; --foreground:0 0% 98%;
    --card:240 10% 5.5%; --card-foreground:0 0% 98%;
    --primary:74 84% 60%; --primary-foreground:240 6% 10%;
    --secondary:240 3.7% 15.9%; --secondary-foreground:0 0% 98%;
    --muted:240 3.7% 15.9%; --muted-foreground:240 5% 64.9%;
    --accent:240 3.7% 15.9%; --accent-foreground:0 0% 98%;
    --success:142 65% 45%; --warm:26 85% 58%; --info:208 70% 55%;
    --border:240 3.7% 17%; --input:240 3.7% 17%; --ring:74 60% 50%;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:hsl(var(--background));color:hsl(var(--foreground));
    font-family:-apple-system,"SF Pro Text","SF Pro Display",BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
  button{font-family:inherit;cursor:pointer}
  input[type=range]{accent-color:hsl(var(--primary))}
  .muted{color:hsl(var(--muted-foreground))}
  .tiny{font-size:12px}
  .app{max-width:840px;margin:0 auto;padding:0 24px 120px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;
    border-radius:var(--radius);font-size:13.5px;font-weight:500;border:1px solid transparent;transition:.12s;white-space:nowrap}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}
  .btn-primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
  .btn-primary:hover{background:hsl(var(--primary)/.9)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-outline{border-color:hsl(var(--input));background:hsl(var(--background));color:hsl(var(--foreground))}
  .btn-outline:hover{background:hsl(var(--accent))}
  .btn-outline:disabled{opacity:.45;cursor:not-allowed}
  .btn-ghost{background:transparent;color:hsl(var(--foreground))}
  .btn-ghost:hover{background:hsl(var(--accent))}
  .btn-sm{height:32px;padding:0 11px;font-size:12.5px}
  .card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:calc(var(--radius) + 2px);box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .card-p{padding:22px}
  h1{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
  h2{font-size:20px;letter-spacing:-.01em;margin:0 0 4px;font-weight:600}
  .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--muted-foreground))}
  h3.lbl{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:hsl(var(--muted-foreground));margin:0 0 10px}
  .sub{color:hsl(var(--muted-foreground));font-size:14.5px;margin:0 0 20px}
  .input,textarea,select{width:100%;border:1px solid hsl(var(--input));border-radius:var(--radius);
    padding:9px 12px;font-family:inherit;font-size:14px;color:hsl(var(--foreground));background:hsl(var(--background));outline:none;transition:.12s}
  textarea{min-height:120px;resize:vertical;line-height:1.6}
  .input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px hsl(var(--ring))}
  label.fld{display:block;font-size:12.5px;font-weight:500;margin:0 0 6px}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:3px 10px;font-size:11.5px;font-weight:600;
    border:1px solid transparent;background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
  .badge-outline{background:transparent;border-color:hsl(var(--border));color:hsl(var(--foreground))}
  .badge-success{background:hsl(var(--success)/.12);color:hsl(142 72% 29%)}
  .badge-warm{background:hsl(var(--warm)/.14);color:hsl(23 76% 34%)}
  .row{display:flex;gap:10px;align-items:center}
  .wrap{flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{border:1px solid hsl(var(--border));border-radius:var(--radius);padding:13px 14px;background:hsl(var(--card))}
  .stat .k{font-size:11px;color:hsl(var(--muted-foreground));text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .stat .v{font-size:16px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
  .learnbar{position:sticky;top:0;z-index:5;background:hsl(var(--background)/.92);backdrop-filter:blur(6px);
    padding:14px 0 12px;border-bottom:1px solid hsl(var(--border));margin-bottom:24px}
  .track{height:4px;width:100%;background:hsl(var(--secondary));border-radius:100px;overflow:hidden}
  .track>span{display:block;height:100%;background:hsl(var(--primary));transition:width .35s ease}
  .learnmeta{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
  .stage{max-width:640px;margin:0 auto}
  .footnav{max-width:640px;margin:32px auto 0;display:flex;justify-content:space-between;align-items:center}
  /* teacher voice */
  .teacher{display:flex;gap:11px;align-items:flex-start;margin:2px 0 14px}
  .tface{width:30px;height:30px;border-radius:50%;background:hsl(var(--warm)/.15);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .tmsg{font-size:15px;line-height:1.5}
  .purpose{font-size:12px;color:hsl(var(--muted-foreground));border-left:2px solid hsl(var(--border));padding-left:11px;margin:0 0 18px;line-height:1.5}
  .checkin{display:flex;gap:10px;background:hsl(var(--success)/.07);border:1px solid hsl(var(--success)/.22);border-radius:var(--radius);padding:12px 14px;font-size:13.5px;margin-top:20px}
  .player{display:flex;align-items:center;gap:14px;background:hsl(var(--secondary));border:1px solid hsl(var(--border));
    border-radius:calc(var(--radius) + 2px);padding:13px 15px}
  .playbtn{width:42px;height:42px;border-radius:50%;border:none;background:hsl(var(--primary));color:hsl(var(--primary-foreground));
    font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .rate{border:1px solid hsl(var(--input));background:hsl(var(--background));border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600;color:hsl(var(--muted-foreground))}
  .rate.on{background:hsl(var(--primary));border-color:hsl(var(--primary));color:hsl(var(--primary-foreground))}
  .audio-progress{height:5px;background:hsl(var(--border));border-radius:999px;overflow:hidden;margin:9px 0 5px}
  .audio-progress>span{display:block;height:100%;background:hsl(208 72% 45%);border-radius:999px;transition:width .25s linear}
  .sbtn{width:30px;height:30px;border-radius:6px;border:1px solid hsl(var(--input));background:hsl(var(--background));
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;color:hsl(var(--foreground))}
  .sbtn:hover{background:hsl(var(--accent))}
  .saybtn{width:auto;min-width:62px;height:30px;padding:0 9px;gap:5px;font-size:12px;font-weight:600}
  .sline{padding:6px 8px;border-radius:6px;transition:.15s;cursor:pointer}
  .sline:hover{background:hsl(var(--accent))}
  .sline.on{background:hsl(78 84% 90%);box-shadow:inset 3px 0 0 hsl(74 80% 48%)}
  .sentence-source{font-weight:600;font-size:15px;line-height:1.55}
  .translation-line{margin-top:4px;color:hsl(var(--muted-foreground));font-size:15px;line-height:1.55;font-weight:500}
  .translation-line.loading{color:hsl(var(--muted-foreground));font-weight:500}
  .status-strip{border:1px solid hsl(208 80% 88%);background:hsl(208 78% 97%);border-radius:8px;padding:9px 11px;color:hsl(208 76% 25%)}
  .status-strip.compact{padding:8px 10px}
  .mini-track{height:3px;width:100%;background:hsl(208 64% 90%);border-radius:999px;overflow:hidden;margin-top:7px}
  .mini-track>span{display:block;height:100%;background:hsl(208 72% 45%);border-radius:999px;transition:width .45s ease}
  .meaning-block{margin-top:10px}
  .meaning-simple{font-size:15px;font-weight:700;line-height:1.35;color:hsl(208 76% 34%)}
  .meaning-simple.inline{font-size:12.5px;font-weight:700}
  .word-form{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;font-size:12px;color:hsl(var(--muted-foreground));line-height:1.4}
  .word-form b{color:hsl(var(--foreground));font-weight:700}
  .verb-forms{margin-top:9px;border:1px solid hsl(var(--border));border-radius:7px;background:hsl(var(--secondary)/.28)}
  .verb-forms summary{list-style:none;cursor:pointer;padding:8px 10px;font-size:12px;font-weight:700;color:hsl(var(--foreground));display:flex;align-items:center;justify-content:space-between;gap:10px}
  .verb-forms summary::after{content:"+";font-size:13px;color:hsl(var(--muted-foreground))}
  .verb-forms[open] summary{border-bottom:1px solid hsl(var(--border))}
  .verb-forms[open] summary::after{content:"-"}
  .verb-forms summary::-webkit-details-marker{display:none}
  .verb-table-wrap{overflow-x:auto}
  .verb-table{width:100%;border-collapse:collapse;min-width:520px;font-size:12px;line-height:1.35}
  .verb-table th,.verb-table td{padding:8px 10px;text-align:left;border-bottom:1px solid hsl(var(--border));vertical-align:top}
  .verb-table tr:last-child td{border-bottom:0}
  .verb-table th{font-size:11px;text-transform:uppercase;color:hsl(var(--muted-foreground));letter-spacing:0;font-weight:700}
  .verb-table th:not(:first-child),.verb-table td:not(:first-child){min-width:112px}
  .verb-tense-cell{font-weight:600;color:hsl(var(--foreground))}
  .verb-form-cell{font-weight:700;color:hsl(var(--foreground));white-space:nowrap}
  .word-example{font-size:12.5px;color:hsl(var(--muted-foreground));line-height:1.5;margin-top:7px;font-style:italic}
  .word-example-translation{font-size:12.5px;color:hsl(var(--muted-foreground));line-height:1.45;margin-top:3px;font-weight:600}
  .meaning-loading{margin-top:10px}
  .skeleton{height:10px;border-radius:999px;background:linear-gradient(90deg,hsl(var(--secondary)),hsl(208 45% 92%),hsl(var(--secondary)));background-size:220% 100%;animation:shimmer 1.25s ease-in-out infinite}
  .skeleton.short{width:34%;margin-bottom:7px}
  .opt{display:flex;align-items:center;gap:10px;border:1px solid hsl(var(--input));border-radius:var(--radius);
    padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.1s;font-size:14px;background:hsl(var(--card))}
  .opt:hover{background:hsl(var(--accent))}
  .opt.correct{border-color:hsl(var(--success));background:hsl(var(--success)/.1)}
  .opt.wrong{border-color:hsl(0 72% 51%);background:hsl(0 72% 51%/.08)}
  .opt .mk{width:20px;height:20px;border-radius:50%;border:1.5px solid hsl(var(--border));flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .wcard{border:1px solid hsl(var(--border));border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:hsl(var(--card))}
  .center{max-width:440px;margin:9vh auto 0;padding-bottom:96px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0 8px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
  .logo{width:26px;height:26px;border-radius:7px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .lang-switch{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:hsl(var(--muted-foreground));white-space:nowrap}
  .lang-switch select{width:auto;height:30px;padding:4px 28px 4px 9px;font-size:12px;border-radius:7px}
  .start-screen{max-width:720px;margin:52px auto 0}
  .start-head{text-align:center;margin-bottom:24px}
  .start-head h1{font-size:30px;letter-spacing:0;margin-bottom:9px}
  .start-head .sub{max-width:520px;margin-left:auto;margin-right:auto}
  .entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .entry-card{appearance:none;text-align:left;border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:10px;padding:22px;display:flex;gap:16px;min-height:178px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease,background .14s ease}
  .entry-card:hover{transform:translateY(-2px);border-color:hsl(var(--ring));box-shadow:0 10px 26px rgba(0,0,0,.08);background:hsl(var(--background))}
  .entry-card:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}
  .entry-icon{width:42px;height:42px;border-radius:9px;background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
  .entry-copy{display:flex;flex-direction:column;min-width:0}
  .entry-title{font-size:17px;font-weight:700;line-height:1.25;letter-spacing:0;margin-top:1px}
  .entry-sub{font-size:13.5px;color:hsl(var(--muted-foreground));line-height:1.5;margin-top:9px}
  .entry-action{font-size:13px;font-weight:700;margin-top:auto;padding-top:18px;color:hsl(var(--foreground))}
  .source-tips{border:1px solid hsl(var(--border));background:hsl(var(--secondary)/.48);border-radius:10px;padding:15px;margin-bottom:16px}
  .source-tips.compact{padding:0;margin:0 0 12px;background:hsl(var(--secondary)/.28);overflow:hidden}
  .ideas-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:0;background:transparent;padding:9px 11px;color:inherit}
  .ideas-toggle b{display:block;font-size:12.5px;line-height:1.2}
  .ideas-toggle small{display:block;font-size:11px;color:hsl(var(--muted-foreground));line-height:1.35;margin-top:2px}
  .ideas-toggle>span:last-child{font-size:11.5px;font-weight:700;color:hsl(var(--foreground));white-space:nowrap}
  .ideas-body{border-top:1px solid hsl(var(--border));padding:9px 10px 10px}
  .idea-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  .idea-tabs button{display:inline-flex;align-items:center;gap:5px;border:1px solid hsl(var(--border));background:hsl(var(--background));border-radius:999px;padding:5px 8px;font-size:11.5px;font-weight:600;color:hsl(var(--muted-foreground))}
  .idea-tabs button.on{border-color:hsl(var(--primary));background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
  .idea-panel{display:grid;grid-template-columns:minmax(130px,.65fr) 1fr;gap:10px;align-items:start}
  .idea-panel b{font-size:12.5px}
  .idea-panel p{font-size:11px;line-height:1.35;color:hsl(var(--muted-foreground));margin:2px 0 0}
  .source-links{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .source-links a,.source-links span{border:1px solid hsl(var(--border));background:hsl(var(--background));border-radius:999px;padding:5px 8px;font-size:11.5px;font-weight:600;text-decoration:none;color:hsl(var(--foreground))}
  .source-links span{color:hsl(var(--muted-foreground))}
  .split-warning{margin-top:10px;border:1px solid hsl(var(--warm)/.36);background:hsl(var(--warm)/.08);border-radius:8px;padding:10px 11px;color:hsl(24 70% 31%);font-size:12.5px;line-height:1.45}
  .split-warning b{display:block;margin-bottom:2px}
  .notice{display:flex;gap:10px;align-items:flex-start;border:1px solid hsl(var(--border));background:hsl(var(--secondary)/.65);border-radius:8px;padding:12px 13px;font-size:13px;color:hsl(var(--muted-foreground));line-height:1.5}
  .segmented{display:inline-flex;gap:4px;background:hsl(var(--secondary));padding:3px;border-radius:9px;width:100%}
  .segmented button{border:none;background:transparent;border-radius:7px;padding:7px 10px;flex:1;font-size:12.5px;font-weight:600;color:hsl(var(--muted-foreground))}
  .segmented button.on{background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .duration-options{display:grid;grid-template-columns:1fr;gap:7px}
  .duration-card{display:flex;align-items:flex-start;gap:9px;text-align:left;border:1px solid hsl(var(--border));background:hsl(var(--background));border-radius:8px;padding:9px 10px;transition:.12s}
  .duration-card:hover{border-color:hsl(var(--ring));background:hsl(var(--accent))}
  .duration-card.on{border-color:hsl(var(--primary));box-shadow:inset 0 0 0 1px hsl(var(--primary))}
  .duration-card b{display:block;font-size:12.5px;line-height:1.25}
  .duration-card small{display:block;font-size:11.2px;line-height:1.35;color:hsl(var(--muted-foreground));margin-top:2px}
  .duration-icon{width:24px;height:24px;border-radius:7px;background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:13px}
  .topic-pills{display:flex;flex-wrap:wrap;gap:6px}
  .topic-pills button{border:1px solid hsl(var(--border));background:hsl(var(--background));border-radius:999px;padding:6px 9px;font-size:12px;font-weight:600;color:hsl(var(--muted-foreground))}
  .topic-pills button.on{border-color:hsl(var(--primary));background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
  .material-results{margin-top:22px}
  .generated-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .generated-card{appearance:none;text-align:left;border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;min-height:190px;transition:.14s}
.generated-card:hover{border-color:hsl(var(--ring));box-shadow:0 8px 20px rgba(0,0,0,.07)}
.generated-card.on{border-color:hsl(var(--primary));box-shadow:inset 0 0 0 1px hsl(var(--primary))}
.generated-card .badge-outline{background:hsl(var(--background));border-color:hsl(var(--foreground)/.18);color:hsl(var(--foreground))}
.generated-card b{font-size:14px;line-height:1.3}
.generated-card>span:last-child{font-size:12.5px;line-height:1.5;color:hsl(var(--muted-foreground))}
  .generated-meta{font-size:11.5px;line-height:1.45;color:hsl(var(--muted-foreground));font-weight:600}
  .preview-source{position:relative;white-space:pre-wrap;line-height:1.7;font-size:15px;padding:2px 2px;max-height:58px;overflow:hidden;color:hsl(var(--foreground))}
  .preview-source:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(to bottom,hsl(var(--card) / 0),hsl(var(--card)))}
  .preview-source.open{max-height:280px;overflow-y:auto}
  .preview-toggle{margin-top:10px;padding-left:0;padding-right:0}
  .reader-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
  .grammar-translation{margin:-4px 0 18px}
  .grammar-card{border:1px solid hsl(var(--border));border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:hsl(var(--secondary)/.38)}
  .grammar-card b{font-size:13.5px}
  .grammar-card p{font-size:12.5px;color:hsl(var(--muted-foreground));line-height:1.48;margin:4px 0 0}
  .grammar-examples{display:grid;gap:8px;margin-top:10px}
  .grammar-example-row{border-top:1px solid hsl(var(--border));padding-top:8px}
  .grammar-example{font-size:13px;font-weight:600;color:hsl(var(--foreground))}
  .grammar-example-translation{font-size:12.5px;line-height:1.45;color:hsl(var(--muted-foreground));margin-top:3px;font-weight:600}
  .summary-stack{display:grid;gap:10px;margin-bottom:14px}
  .summary-card{border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--card));padding:0}
  .summary-card summary{display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;cursor:pointer;padding:11px 13px}
  .summary-card summary::-webkit-details-marker{display:none}
  .summary-card[open] summary{border-bottom:1px solid hsl(var(--border))}
  .summary-detail{font-size:12.5px;color:hsl(var(--muted-foreground));line-height:1.5;padding:10px 13px 0}
  .summary-card .verb-forms{margin:9px 13px 12px}
  .summary-card .word-example{padding:0 13px 4px}
  .summary-card .word-example:last-child{padding-bottom:12px}
  .summary-card .word-example-translation{padding:0 13px}

.shell.pinned .sidebar{opacity:1;visibility:visible;transform:translateY(0) scale(1);pointer-events:auto}
.path-anchor::after{content:"";position:absolute;top:36px;left:0;width:var(--w-open);height:12px;z-index:0}

.side-head{padding:14px 14px 0}

.donation-card .btn{margin-bottom:8px}
.save-card{border-color:hsl(var(--primary)/.48);background:hsl(var(--primary)/.10)}
.save-card .done-card-title{margin-bottom:8px}
.save-card .done-card-note{margin-bottom:16px}
.save-login{display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;align-items:end;max-width:430px;margin:0 auto}
.save-login label{grid-column:1 / -1}
.save-status{margin-top:10px;font-weight:600}
.save-status.ok{color:hsl(var(--success))}
.save-status.error{color:hsl(0 72% 43%)}
.save-hint{margin-top:10px}
.donation-feedback{margin-top:16px;padding-top:14px;border-top:1px solid hsl(var(--border));text-align:left}
.donation-feedback label{display:block;margin-bottom:7px}
.donation-feedback textarea{min-height:74px;font-size:13px}
.feedback-pop{position:fixed;right:22px;bottom:22px;z-index:35;width:min(360px,calc(100vw - 32px));border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:12px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.16);text-align:left;animation:feedbackIn .18s ease-out both}
@keyframes feedbackIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.feedback-pop-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.feedback-close{width:28px;height:28px;border-radius:7px;border:1px solid hsl(var(--border));background:hsl(var(--background));color:hsl(var(--foreground));font-size:18px;line-height:1}
.feedback-close:hover{background:hsl(var(--accent))}
.feedback-step-dots{display:flex;gap:5px;margin-bottom:10px}
.feedback-step-dots span{width:18px;height:4px;border-radius:999px;background:hsl(var(--border))}
.feedback-step-dots span.on{background:hsl(var(--primary))}
.feedback-question{display:flex;align-items:center;gap:9px;font-weight:700;margin-bottom:10px}
.feedback-question-icon{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:hsl(var(--primary)/.15);font-size:16px;flex:0 0 auto}
.feedback-options{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.feedback-choice{cursor:pointer;background:hsl(var(--background))}
.feedback-choice.on{border-color:hsl(var(--primary));background:hsl(var(--primary)/.24);font-weight:800}
.feedback-choice:disabled{opacity:.38;cursor:not-allowed}
.feedback-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* mobile drawer */
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:44}
.scrim.on{display:block}
@media(max-width:1200px){
  .shell.pinned .sidebar{opacity:1;visibility:visible;transform:scale(1);pointer-events:auto}
  .path-anchor::after{display:none}
}

/* ===== v3 tweaks: skeleton cards, step header, sentence nav, done recolor, mobile ===== */
.gen-skel{pointer-events:none}
.gen-skel .sk{display:block;border-radius:999px;background:linear-gradient(90deg,hsl(var(--secondary)),hsl(208 45% 92%),hsl(var(--secondary)));background-size:220% 100%;animation:shimmer 1.25s ease-in-out infinite}
.gen-skel .sk-badge{width:64px;height:18px;border-radius:6px}
.gen-skel .sk-badge2{width:34px;height:18px;border-radius:6px}
.gen-skel .sk-title{width:78%;height:15px}
.gen-skel .sk-meta{width:55%;height:11px}
.gen-skel .sk-line{width:100%;height:10px}
.gen-skel .sk-line.short{width:68%}

/* step header: eyebrow + title on the left, skip on the right */
.step-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.step-head .step-head-main{min-width:0}
.step-head .step-skip{flex:0 0 auto;margin-top:2px}

/* microscope / per-sentence nav — one row, left / right */
.sent-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.sent-nav .btn{min-width:148px}

/* done page recolor */
.done-words{margin:0 auto 26px;text-align:center}
.survey-soft{border:none!important;background:hsl(var(--primary)/.10)!important}
.dark .survey-soft{background:hsl(var(--primary)/.16)!important}
.dark .sbtn{background:hsl(240 8% 10%);border-color:hsl(240 4% 28%);color:hsl(var(--foreground))}
.dark .sbtn:hover{background:hsl(240 5% 18%);border-color:hsl(240 5% 36%)}
.dark .sline.on{background:hsl(var(--primary) / .16);box-shadow:inset 3px 0 0 hsl(var(--primary) / .72);color:hsl(var(--foreground))}
.dark .sline.on .sentence-source{color:hsl(var(--foreground))}
.dark .sline.on .translation-line{color:hsl(240 7% 78%)}

@media(max-width:640px){
  .main{padding:18px 16px calc(132px + env(safe-area-inset-bottom))}
  .path-anchor{position:sticky;top:0;left:0;width:100%;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:hsl(var(--background)/.94);backdrop-filter:blur(8px);border-bottom:1px solid hsl(var(--border))}
  .chrome-row{max-width:100%;overflow-x:auto;padding-bottom:1px}
  .sidebar{top:calc(52px + env(safe-area-inset-top));left:16px;max-width:calc(100vw - 32px);max-height:calc(100vh - 76px - env(safe-area-inset-top))}
  textarea,select,.input{font-size:16px}
  .footnav,.main .footnav{flex-wrap:nowrap;gap:10px}
  .main .footnav{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .main .footnav>.btn,.main .footnav>.row{flex:1;min-width:0}
  .main .footnav>.row{justify-content:flex-end}
  .main .footnav .btn{min-width:0;width:100%;white-space:normal;text-align:center}
  .sent-nav .btn{min-width:0;flex:1}
  .grid3,.grid4{grid-template-columns:1fr}
  .player{gap:10px;padding:11px 12px}
  .playbtn{width:44px;height:44px}
  .sbtn{min-width:34px;height:34px}
  .step-head{flex-wrap:wrap}
  .done-actions{flex-direction:column-reverse}
  .done-actions .btn{width:100%}
  .save-login{grid-template-columns:1fr}
  .save-login .btn{width:100%}
  .stats-grid,.lesson-card{grid-template-columns:1fr}
  .lesson-meta{text-align:left;flex-direction:row;flex-wrap:wrap}
  .resume-card{align-items:flex-start;flex-direction:column}
  .resume-card .btn{width:100%}
  .auth-pop-actions .btn,.empty-actions .btn{width:100%}
  .feedback-pop{left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:auto}
  .scanw{padding:3px 5px!important}
}

Bram: Hoe bedoel je dat precies?
Sanne: Als iemand tijdens de lunch eerlijk vertelt waar hij tegenaan loopt, begrijp je meteen welke spanning er in een team zit.
Bram: Dat herken ik. Een losse opmerking kan duidelijk maken waarom een planning steeds verschuift.
Sanne: Precies. Daarom probeer ik niet alleen naar besluiten te luisteren, maar ook naar de toon ertussen.
Bram: Misschien is dat wel de kern van goede samenwerking: niet sneller praten, maar beter opmerken wat niet hardop wordt gezegd.`},{title:"De stille afspraak in de buurt",source:"Culture note",level:e.slice(0,2),text:"In veel Nederlandse buurten bestaan afspraken die nergens officieel zijn vastgelegd. Niemand heeft ze ondertekend, maar bijna iedereen kent ze. Je zet je fiets niet midden voor de ingang, je groet de buur die je vaak ziet en je klaagt pas over lawaai nadat je eerst vriendelijk hebt aangebeld. Zulke gewoonten lijken klein, maar ze bepalen hoe prettig mensen samenleven. Vooral nieuwe bewoners ontdekken deze regels pas wanneer ze per ongeluk iets verkeerd doen. Dan blijkt dat cultuur niet alleen in musea of tradities zit, maar ook in alledaagse verwachtingen over ruimte, rust en rekening houden met elkaar."},{title:"Waarom thuiswerken niet voor iedereen vrijheid betekent",source:"News explainer",level:e.slice(0,2),text:"Thuiswerken wordt vaak gepresenteerd als een vorm van vrijheid, maar de werkelijkheid is genuanceerder. Voor sommige werknemers betekent het minder reistijd en meer concentratie. Voor anderen vervagen juist de grenzen tussen werk en priv\xE9. De keukentafel wordt een kantoor, een korte pauze voelt onterecht als tijdverlies en overleg via schermen maakt misverstanden soms groter. Bedrijven zoeken daarom naar een nieuw evenwicht. Niet de vraag of iedereen thuis of op kantoor moet werken is doorslaggevend, maar welke taken waar het beste tot hun recht komen. Flexibiliteit vraagt dus ook duidelijke afspraken."},{title:"Een kleine beslissing in de supermarkt",source:"Practical situation",level:e.slice(0,2),text:"Bij de supermarkt twijfelt Noor tussen goedkope aardbeien uit het buitenland en duurdere aardbeien van een boerderij in de regio. Vroeger koos ze zonder nadenken de laagste prijs, maar tegenwoordig let ze vaker op herkomst, seizoen en verpakking. Toch is de keuze niet eenvoudig. Haar budget is beperkt en duurzame producten zijn niet altijd betaalbaar. Terwijl ze de bakjes vergelijkt, beseft ze dat consumenten vaak verantwoordelijk worden gemaakt voor problemen die groter zijn dan hun winkelmandje. Uiteindelijk kiest ze de regionale aardbeien, maar met het gevoel dat echte verandering niet alleen van individuele klanten kan afhangen."}]):t==="Dutch"?l([{title:"Een rustige ochtend in de stad",source:"Daily story",level:e.slice(0,2),text:"Elke ochtend fietst Noor langs de gracht naar haar werk. Vandaag is de lucht helder en de stad voelt langzaam wakker. Bij de bakker koopt ze een klein broodje en praat ze kort met de man achter de toonbank. Hij vertelt dat het drukker wordt sinds de zon weer schijnt. Noor glimlacht, stapt op haar fiets en merkt dat ze deze gewone ochtend eigenlijk heel fijn vindt."},{title:"Waarom steeds meer mensen de trein nemen",source:"Short news explainer",level:ur(e)<=1?"B1":e.slice(0,2),text:"In Nederland kiezen steeds meer mensen voor de trein als ze naar een andere stad reizen. De reis is vaak rustig, en reizigers kunnen onderweg lezen, werken of naar muziek luisteren. Toch zijn er ook klachten: soms zijn treinen vol of te laat. Volgens vervoersbedrijven blijft de trein belangrijk, vooral voor mensen die duurzamer willen reizen."},{title:"Een gesprek over weekendplannen",source:"Dialogue",level:e.slice(0,2),text:`Sanne: Wat ga jij dit weekend doen?
Amir: Ik wil naar een markt in Utrecht, omdat ik nieuwe kazen wil proeven en misschien een cadeau zoek voor mijn zus.
Sanne: Dat klinkt gezellig. Zullen we samen gaan?
Amir: Goed idee. We spreken af bij het station en drinken daarna ergens koffie.`},{title:"Bij de supermarkt",source:"Practical situation",level:e.slice(0,2),text:"Mila gaat na het werk naar de supermarkt. Ze koopt brood, melk, appels en rijst. Bij de kassa zoekt ze haar pas. De vrouw achter haar wacht rustig. Mila zegt sorry en betaalt snel. Buiten stopt ze alles in haar tas en loopt ze naar huis."},{title:"Een korte pauze",source:"Daily story",level:e.slice(0,2),text:"Tom werkt vandaag thuis. Om tien uur maakt hij koffie en opent hij het raam. Op straat hoort hij een fietsbel en twee kinderen lachen. Tom leest nog een korte mail. Daarna neemt hij vijf minuten pauze en kijkt hij naar de lichte lucht."},{title:"In de bibliotheek",source:"Culture note",level:e.slice(0,2),text:"Sara gaat op woensdag naar de bibliotheek. Ze zoekt een boek met korte verhalen. De medewerker helpt haar en geeft ook een kleine kaart. Op die kaart staan de tijden van een taalgroep. Sara neemt het boek mee en wil volgende week terugkomen."},{title:"Een afspraak bij de dokter",source:"Practical situation",level:e.slice(0,2),text:"Daan belt de dokter omdat hij al twee dagen moe is. De assistent vraagt naar zijn naam en geboortedatum. Daan krijgt een afspraak om half drie. Hij schrijft de tijd op papier en legt zijn pas klaar bij de deur."},{title:"Koken met een vriend",source:"Dialogue",level:e.slice(0,2),text:`Lisa: Wat eten we vanavond?
